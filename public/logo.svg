<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Golden Star Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Page Gradients -->
    <linearGradient id="pageLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="pageRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Icon Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="6" />

  <!-- Background Decorative Grid/Constellation Dots -->
  <circle cx="96" cy="110" r="3" fill="#ffffff" fill-opacity="0.3" />
  <circle cx="416" cy="110" r="3" fill="#ffffff" fill-opacity="0.3" />
  <circle cx="80" cy="380" r="3" fill="#ffffff" fill-opacity="0.2" />
  <circle cx="432" cy="380" r="3" fill="#ffffff" fill-opacity="0.2" />

  <!-- Central Open Book Graphic with Shadow -->
  <g filter="url(#subtleShadow)">
    <!-- Book Spine Glow / Underlay -->
    <path d="M256 365 C 210 350, 140 355, 96 380 L 96 210 C 140 185, 210 180, 256 198 C 302 180, 372 185, 416 210 L 416 380 C 372 355, 302 350, 256 365 Z" fill="#0f172a" fill-opacity="0.25" />

    <!-- Left Page -->
    <path d="M256 352 C 215 338, 150 342, 108 366 L 108 200 C 150 176, 215 172, 256 188 Z" fill="url(#pageLeft)" />
    
    <!-- Right Page -->
    <path d="M256 352 C 297 338, 362 342, 404 366 L 404 200 C 362 176, 297 172, 256 188 Z" fill="url(#pageRight)" />

    <!-- Center Spine Ridge -->
    <path d="M256 188 L 256 352" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />

    <!-- Left Page Content: Math & Grammar Lines -->
    <line x1="140" y1="228" x2="224" y2="216" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" />
    <line x1="140" y1="258" x2="224" y2="246" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" />
    <line x1="140" y1="288" x2="198" y2="278" stroke="#3b82f6" stroke-width="7" stroke-linecap="round" />
    <line x1="140" y1="318" x2="216" y2="307" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" />

    <!-- Right Page Content: Target Checklist & Checkmark -->
    <line x1="288" y1="216" x2="372" y2="228" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" />
    <line x1="288" y1="246" x2="372" y2="258" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" />
    <line x1="288" y1="278" x2="346" y2="288" stroke="#3b82f6" stroke-width="7" stroke-linecap="round" />
    <line x1="288" y1="307" x2="364" y2="318" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" />

    <!-- Emerald Success Checkmark Badge on Page -->
    <circle cx="340" cy="285" r="16" fill="#10b981" />
    <path d="M333 285 L 338 290 L 348 280" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Golden 1600 Target Star / Beacon Rising from Center -->
  <g filter="url(#glow)">
    <!-- Star Path -->
    <path d="M 256 70 Q 256 122 204 122 Q 256 122 256 174 Q 256 122 308 122 Q 256 122 256 70 Z" fill="url(#goldGrad)" />
    
    <!-- Mini Diamond Sparkles -->
    <path d="M 160 106 Q 160 120 146 120 Q 160 120 160 134 Q 160 120 174 120 Q 160 120 160 106 Z" fill="#fef08a" opacity="0.9" />
    <path d="M 352 106 Q 352 120 338 120 Q 352 120 352 134 Q 352 120 366 120 Q 352 120 352 106 Z" fill="#fef08a" opacity="0.9" />
  </g>

  <!-- 1600 / Precision Emblem Pill at Bottom -->
  <g>
    <rect x="196" y="405" width="120" height="38" rx="19" fill="#0f172a" fill-opacity="0.6" stroke="#fbbf24" stroke-width="2" />
    <text x="256" y="430" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" letter-spacing="2.5">1600 AI</text>
  </g>
</svg>
